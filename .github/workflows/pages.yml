# Publica la carpeta public/ en GitHub Pages en cada push a main.
# En GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # La tienda (public/) y, en /erp/, la web del back-office ERP/CRM (erp/web/): son dos aplicaciones
      # distintas que se publican en el mismo sitio estático, pero cada una con su propio proyecto de Supabase.
      - name: Montar el sitio
        run: |
          mkdir -p _site
          cp -r public/. _site/
          mkdir -p _site/erp
          cp -r erp/web/. _site/erp/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
