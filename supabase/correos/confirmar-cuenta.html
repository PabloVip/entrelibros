<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;padding:24px;color:#1D2537">
  <div style="background:#1D2537;color:#fff;padding:18px 22px;border-radius:10px 10px 0 0">
    <strong style="font-family:Georgia,serif;font-size:20px">Entrelibros</strong>
  </div>
  <div style="border:1px solid #D8DDE6;border-top:0;padding:22px;border-radius:0 0 10px 10px">

    <p>Hola:</p>
    <p>Gracias por crear una cuenta en Entrelibros. Pulsa el botón para confirmar tu email ({{ .Email }}) y activarla.</p>
    <p style="margin:24px 0">
      <a href="{{ .ConfirmationURL }}" style="background:#7E2B37;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Confirmar mi cuenta</a>
    </p>
    <p style="font-size:13px;color:#5A6377">Si no has creado tú esta cuenta, ignora este correo.</p>
    <p style="font-size:12px;color:#5A6377;border-top:1px solid #D8DDE6;padding-top:12px;margin-top:20px">
      Prototipo académico (UCAM). Tienda ficticia sin actividad comercial.</p>
  </div>
</div>
