# Configuración de las Edge Functions para la CLI de Supabase (supabase functions deploy).
# Está en el repositorio para que verify_jwt no se pierda al volver a desplegar.
#
# verify_jwt = false en las dos funciones del pago: la tienda usa la clave publishable
# (sb_publishable_…), que no es un JWT, y la compra como invitado no tiene sesión; con
# verify_jwt = true Supabase respondería 401. No dependen de quién llama: validan el pedido,
# el importe sale de la BD y el pago solo se confirma si Stripe dice que la sesión está pagada.
project_id = "entrelibros"

[functions.create-checkout-session]
verify_jwt = false

[functions.confirm-checkout-session]
verify_jwt = false

# Stripe no manda ningún JWT: la función comprueba la firma del aviso con STRIPE_WEBHOOK_SECRET
[functions.stripe-webhook]
verify_jwt = false

# Correo de confirmación con la factura: lo pide la página del pedido, también sin cuenta.
# Solo envía al email del pedido, si coincide con el número y está pagado (send-order-email/index.ts).
[functions.send-order-email]
verify_jwt = false
