<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso · Back-office · Entrelibros</title>
  <meta name="theme-color" content="#10182B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body data-page="login" class="admin">
  <div class="academic-banner" role="note">
    <strong>Prototipo académico</strong>
    <span class="banner-long">del Grado en Ingeniería Informática (UCAM). Tienda ficticia: no introduzcas datos personales ni medios de pago reales.</span>
    <span class="banner-short">(UCAM): no uses datos reales.</span>
  </div>
  <main class="container narrow" id="contenido">
    <h1>Back-office</h1>
    <p class="lead">Acceso solo para administradores de la tienda.</p>
    <form id="login" class="card-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="btn">Entrar</button>
      <p id="login-msg" class="form-msg" role="alert"></p>
    </form>
    <p><a href="index.html">← Volver a la tienda</a></p>
  </main>
  <script type="module" src="js/core/i18n.js"></script>
  <script type="module" src="js/pages/admin/login.js"></script>
</body>
</html>
