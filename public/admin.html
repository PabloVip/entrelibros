<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso · Back-office · Entrelibros</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" class="admin">
  <div class="academic-banner" role="note">
    <strong>Prototipo académico</strong> · Grado en Ingeniería Informática (UCAM).
    Tienda ficticia sin actividad comercial: no introduzcas datos personales reales ni medios de pago reales.
  </div>
  <main class="container narrow" id="contenido">
    <h1>Back-office</h1>
    <p class="lead">Acceso solo para administradores de la tienda.</p>
    <form id="login" class="card-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="btn">Entrar</button>
      <p id="login-msg" class="form-msg" role="alert"></p>
    </form>
    <p><a href="index.html">← Volver a la tienda</a></p>
  </main>
  <script type="module" src="js/pages/admin/login.js"></script>
</body>
</html>
