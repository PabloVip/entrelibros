<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pedidos · Back-office · Entrelibros</title>
  <meta name="theme-color" content="#10182B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body data-page="pedidos" class="admin">
  <div class="academic-banner" role="note">
    <strong>Prototipo académico</strong>
    <span class="banner-long">del Grado en Ingeniería Informática (UCAM). Tienda ficticia: no introduzcas datos personales ni medios de pago reales.</span>
    <span class="banner-short">(UCAM): no uses datos reales.</span>
  </div>
  <header id="site-header" class="site-header"></header>
  <main class="container" id="contenido">
    <h1>Pedidos</h1>
    <section id="kpis" class="kpis" aria-label="Resumen"></section>

    <form id="order-filters" class="toolbar" role="search">
      <label>Estado
        <select name="status" id="f-status"><option value="">Todos</option></select>
      </label>
      <label>Buscar
        <input name="q" type="search" maxlength="60" placeholder="Nº de pedido o email">
      </label>
    </form>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th class="num">Artículos</th><th class="num">Total</th><th>Estado</th></tr>
        </thead>
        <tbody id="orders"><tr><td colspan="6">Cargando…</td></tr></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/core/i18n.js"></script>
  <script type="module" src="js/pages/admin/orders.js"></script>
</body>
</html>
