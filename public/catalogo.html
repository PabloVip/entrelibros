<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Catálogo · Entrelibros</title>
  <meta name="theme-color" content="#10182B">
  <meta name="color-scheme" content="light dark">
  <!-- tema (día/noche) antes de pintar: sin destello al cargar (js/core/boot.js) -->
  <script src="js/core/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body data-page="catalogo">
  <div class="academic-banner" role="note">
    <strong>Prototipo académico</strong>
    <span class="banner-long">del Grado en Ingeniería Informática (UCAM). Tienda ficticia: no introduzcas datos personales ni medios de pago reales.</span>
    <span class="banner-short">(UCAM): no uses datos reales.</span>
  </div>
  <header id="site-header" class="site-header"></header>

  <main class="container" id="contenido">
    <h1>Catálogo</h1>

    <div class="catalog-layout">
      <!-- Solo en el móvil: los filtros empiezan plegados (ocupan casi dos pantallas) y este botón los abre.
           El número es cuántos filtros hay aplicados. En escritorio el CSS lo oculta. -->
      <button type="button" id="filters-toggle" class="btn btn-secondary filters-toggle"
              aria-controls="filters" aria-expanded="false">
        Buscar y filtrar <span id="filters-active" class="nav-count"></span>
      </button>
      <form id="filters" class="filters" aria-label="Filtros del catálogo">
        <div class="field">
          <label for="f-q">Buscar</label>
          <input id="f-q" name="q" type="search" maxlength="60" placeholder="Kioto, dragón…">
        </div>

        <fieldset class="field">
          <legend>Tipo de producto</legend>
          <label><input type="radio" name="type" value="" checked> Todos</label>
          <label><input type="radio" name="type" value="kit"> Kits completos</label>
          <label><input type="radio" name="type" value="accesorio"> Accesorios</label>
          <label><input type="radio" name="type" value="recambio"> Recambios</label>
        </fieldset>

        <div class="field">
          <label for="f-theme">Temática</label>
          <select id="f-theme" name="theme"><option value="">Todas</option></select>
        </div>

        <div class="field">
          <label for="f-difficulty">Dificultad de montaje</label>
          <select id="f-difficulty" name="difficulty">
            <option value="">Cualquiera</option>
            <option value="principiante">Principiante</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
          </select>
        </div>

        <fieldset class="field">
          <legend>Iluminación</legend>
          <label><input type="radio" name="lighting" value="" checked> Indiferente</label>
          <label><input type="radio" name="lighting" value="con"> Disponible con luz</label>
          <label><input type="radio" name="lighting" value="sin"> Disponible sin luz</label>
        </fieldset>

        <div class="field">
          <label for="f-width">Ancho máximo (hueco en la estantería)</label>
          <select id="f-width" name="maxWidth"><option value="">Cualquiera</option></select>
        </div>

        <div class="field">
          <label for="f-price">Precio máximo (€)</label>
          <input id="f-price" name="maxPrice" type="number" min="1" max="1000" step="1" inputmode="numeric" placeholder="Sin límite">
        </div>

        <button type="reset" class="btn btn-secondary">Quitar filtros</button>
      </form>

      <section aria-labelledby="results-title">
        <div class="results-bar">
          <p id="results-title" class="results-count" aria-live="polite">Cargando…</p>
          <label class="sort">Ordenar por
            <select id="f-sort" name="sort" form="filters"></select>
          </label>
        </div>
        <div id="results" class="grid">
          <div class="sk-card" aria-hidden="true"><span class="skeleton"></span><span class="sk-body"><span class="skeleton sk-line w40"></span><span class="skeleton sk-title w80"></span><span class="skeleton sk-line w60"></span></span></div>
          <div class="sk-card" aria-hidden="true"><span class="skeleton"></span><span class="sk-body"><span class="skeleton sk-line w40"></span><span class="skeleton sk-title w80"></span><span class="skeleton sk-line w60"></span></span></div>
          <div class="sk-card" aria-hidden="true"><span class="skeleton"></span><span class="sk-body"><span class="skeleton sk-line w40"></span><span class="skeleton sk-title w80"></span><span class="skeleton sk-line w60"></span></span></div>
          <div class="sk-card" aria-hidden="true"><span class="skeleton"></span><span class="sk-body"><span class="skeleton sk-line w40"></span><span class="skeleton sk-title w80"></span><span class="skeleton sk-line w60"></span></span></div>
          <div class="sk-card" aria-hidden="true"><span class="skeleton"></span><span class="sk-body"><span class="skeleton sk-line w40"></span><span class="skeleton sk-title w80"></span><span class="skeleton sk-line w60"></span></span></div>
          <div class="sk-card" aria-hidden="true"><span class="skeleton"></span><span class="sk-body"><span class="skeleton sk-line w40"></span><span class="skeleton sk-title w80"></span><span class="skeleton sk-line w60"></span></span></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/core/i18n.js"></script>
  <script type="module" src="js/pages/catalog.js"></script>
</body>
</html>
